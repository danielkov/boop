name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check for release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.boop.outputs.released }}
      version: ${{ steps.boop.outputs.version }}
      changelog: ${{ steps.boop.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run boop
        id: boop
        uses: ./

      - name: Install Rust toolchain
        if: steps.boop.outputs.released == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Update crate version
        if: steps.boop.outputs.released == 'true'
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.boop.outputs.version }}"/' Cargo.toml
          cargo update --workspace

      - name: Commit and push
        if: steps.boop.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .boop/releases.toml Cargo.toml Cargo.lock
          git commit -m "$(cat <<'MSG'
          ci(boop): release ${{ steps.boop.outputs.version }} [skip ci]

          ${{ steps.boop.outputs.changelog }}
          MSG
          )"
          git tag "v${{ steps.boop.outputs.version }}"
          git push origin main --tags

      - name: Update major version tag
        if: steps.boop.outputs.released == 'true'
        run: |
          MAJOR=$(echo "${{ steps.boop.outputs.version }}" | cut -d. -f1)
          git tag -fa "v$MAJOR" -m "Update v$MAJOR to ${{ steps.boop.outputs.version }}"
          git push origin "v$MAJOR" --force

  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.check.outputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../boop-${{ matrix.target }}.tar.gz boop
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../boop-${{ matrix.target }}.zip boop.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boop-${{ matrix.target }}
          path: boop-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} release/ \;
          cd release && sha256sum * > checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          body: ${{ needs.check.outputs.changelog }}
          files: release/*
          draft: false
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
